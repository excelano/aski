[package]
name = "aski"
homepage = "https://github.com/excelano/aski"
version = "0.1.0"
edition = "2024"
description = "one-shot questions for command-line LLMs — no quotes, no follow-up"
license = "MIT"
authors = ["David M. Anderson"]
repository = "https://github.com/excelano/aski"
readme = "README.md"
keywords = ["llm", "cli", "claude", "prompt", "shell"]
categories = ["command-line-utilities"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.4"

[package.metadata.deb]
maintainer = "David M. Anderson <david.anderson@excelano.com>"
extended-description = """
aski puts a quick terminal question to a command-line LLM and prints
the answer. There is no session and no follow-up, and the question is
simply the rest of the command line, so nothing needs quoting. Each
LLM is a table in a TOML config file naming the argv that puts that
LLM in one-shot mode, together with any standing context to send
along, so adding one is configuration rather than code. The first
argument selects an LLM when it names one, and is the first word of
the question when it does not. For scripts, which cannot rely on that
guess, flags name the LLM outright, bound the wait, refuse standard
input, and override the standing context, and the exit codes follow
timeout(1)."""
section = "utils"
priority = "optional"
depends = "libc6, libgcc-s1"
assets = [
    ["target/release/aski", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/aski/README.md", "644"],
    ["LICENSE", "usr/share/doc/aski/copyright", "644"],
]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
